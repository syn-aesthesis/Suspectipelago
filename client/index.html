<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Suspectipelago</title>
        <style>
            html, body { margin: 0; height: 100%; background: #000; color: #aaa; font-family: "Courier New", Courier, monospace; }
            label { display: block; margin: 10px 0 2px; color: #fff; font-size: 13px; }
            input { width: 100%; box-sizing: border-box; padding: 6px; background: #000; color: #fff; border: 1px solid #aaa; font: inherit; }
            .buttons { margin-top: 16px; display: flex; gap: 10px; }
            button { flex: 1; padding: 8px; background: #aaa; color: #000; border: 0; font: inherit; cursor: pointer; }
            button:hover:not(:disabled) { background: #ffff55; }
            button.secondary { background: #555; color: #fff; }
            button:disabled { background: #555; cursor: default; }
            .hint { margin-top: 12px; font-size: 12px; color: #aaa; }
        </style>
    </head>
    <body>
        <main id="connect">
            <h1>SUSPECTIPELAGO</h1>
            <p>An Archipelago murder mystery game</p>
            <form id="connect-form">
                <label for="ap-url">Server</label>
                <input id="ap-url" value="archipelago.gg:38281" autocomplete="off" spellcheck="false" />
                <label for="ap-slot">Slot name</label>
                <input id="ap-slot" autocomplete="off" spellcheck="false" />
                <label for="ap-password">Password (optional)</label>
                <input id="ap-password" type="password" autocomplete="off" />
                <div class="buttons">
                    <button id="connect-button" type="submit">Connect</button>
                    <button id="offline-button" type="button">Play offline</button>
                </div>
            </form>
            <div id="connect-error" role="alert"></div>
            <div class="hint">
                If this page is served over https://, browsers only allow wss:// servers (or localhost).
            </div>
        </main>
        <div id="game"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
